<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zokii Studio v5 Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><nav class="nav"><div class="brand">ZOKII STUDIO v5 ADMIN</div><a href="index.html">SITE</a></nav><section id="login" class="card" style="max-width:460px;margin:70px auto"><h1>ADMIN PANEL</h1><p class="muted">Password</p><input id="password" class="input" type="password" autocomplete="current-password"><button id="loginBtn" class="btn">LOGIN</button><p id="loginMsg" class="error"></p></section><section id="dash" class="hidden"><div class="row"><div class="card" style="flex:1"><div class="muted">Active Licenses</div><div id="active" class="stat">0</div></div><div class="card" style="flex:1"><div class="muted">Expired Licenses</div><div id="expired" class="stat">0</div></div><div class="card" style="flex:1"><div class="muted">Total Licenses</div><div id="total" class="stat">0</div></div></div><div class="card" style="margin-top:16px"><div class="row"><button id="generate" class="btn">Generate 3-Day Code</button><button id="refresh" class="btn dark">Refresh</button><button id="logout" class="btn dark">Logout</button></div><p id="result" class="ok"></p></div><div class="card" style="margin-top:16px;overflow:auto"><input id="search" class="input" placeholder="Search license or device"><table class="table"><thead><tr><th>Code</th><th>Status</th><th>Created</th><th>Expires</th><th>Device</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="config.js" onerror=""></script><script src="admin.js"></script></body></html>
